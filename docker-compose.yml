services:
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    environment:
      - MOCK_API_URL=http://mock-api-service:${MOCK_API_PORT}
      - SERVER_PORT=8080
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - MAX_BOT_USERNAME=${MAX_BOT_USERNAME}
      # Хосту бота нужен адрес сайта, реально доступный тому, кто нажмёт
      # кнопку в MAX (телефон пользователя), поэтому localhost по
      # умолчанию годится только для локальной отладки на одной машине.
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:${WEB_APP_PORT}}
    depends_on:
      mock-api-service:
        condition: service_healthy
    networks:
      - internal-network
    restart: on-failure

  mock-api-service:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-mock-api
    ports:
      - "127.0.0.1:${MOCK_API_PORT}:3001"
    networks:
      - internal-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (response) => {process.exit(response.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

  mini-app-service:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-mini-app
    # Без префикса 127.0.0.1: сайт должен открываться с телефона родителя
    # по кнопке из бота, а не только с машины, на которой поднят docker
    # compose. При 127.0.0.1:${WEB_APP_PORT}:80 порт слушает только loopback
    # хоста, и даже устройства в той же Wi-Fi сети до него не достучатся.
    ports:
      - "${WEB_APP_PORT}:80"
    depends_on:
      - mock-api-service
    networks:
      - internal-network
    restart: always

networks:
  internal-network:
    driver: bridge